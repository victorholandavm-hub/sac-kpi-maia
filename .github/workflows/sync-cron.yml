name: Sync GHL + TOTVS (a cada 2h)

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch: {}

# Aponta pra VPS (sac.lojasmaia.com.br), não mais pro projeto Vercel
# (sac-kpi-maia.vercel.app) -- pedido do Victor 26/08/2026, depois do aviso
# da Vercel de 75% do free tier de Fluid Active CPU usado. A produção real já
# roda 100% na VPS desde a migração (ver lojas-maia-deploy, memória) -- o
# projeto Vercel só continuava recebendo tráfego por causa desse cron (e,
# separadamente, de um consumo não identificado batendo direto no domínio
# .vercel.app da assistência, sem relação com este workflow). Rota/lógica de
# cada endpoint não muda -- é o mesmo código, só servido de outro lugar.
#
# /api/backup entra aqui também (antes era só o cron nativo do vercel.json,
# 1x/dia) -- com o projeto Vercel pausado esse cron nativo para de disparar,
# então precisa de um substituto. Chamar a cada 2h junto dos outros não
# duplica trabalho: MIN_INTERVAL_HOURS=72 dentro da própria rota (ver
# src/app/api/backup/route.ts) já garante que só uma em cada ~36 chamadas
# realmente roda o dump; as outras retornam { skipped: true } rápido, sem
# custo relevante.
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # continue-on-error em cada passo -- descoberto em 08/09/2026: /api/sync
      # sozinho já passou a levar mais de 60s (o Nginx da VPS corta nesse
      # tempo, sem proxy_read_timeout configurado -- ver ajuste em paralelo no
      # servidor), e como os 3 passos rodavam em sequência SEM isso, o
      # primeiro "falhar" (na visão do curl/Nginx, mesmo o /api/sync
      # terminando certo por trás) impedia os outros dois de rodar --
      # /api/sync-ai-classify ficou 13 dias sem executar por causa disso.
      #
      # /api/totvs-sync entrou aqui em 12/09/2026: até então o backfill de
      # pedidos do Protheus dependia só de um disparador externo (fora
      # deste repositório, nunca identificado -- nem crontab nem systemd
      # timer na VPS, GitHub Actions não chamava essa rota) que ficou 14h+
      # sem rodar sem ninguém perceber. O comentário antigo em
      # totvsSync.ts/totvs-sync/route.ts ("roda só num computador dentro da
      # rede liberada, VPS/nuvem não alcança o Protheus") é da época do
      # Vercel -- testado direto da VPS em 12/09/2026 e funcionou normal,
      # sem timeout nenhum. Ter esse disparo aqui garante um mínimo
      # visível/monitorável (a cada ~2-3h, ver agendamento no topo do
      # arquivo) mesmo que o disparador externo (que continua podendo
      # existir, rodando mais frequente) volte a falhar.
      - name: Chamar /api/totvs-sync
        continue-on-error: true
        run: |
          curl -sf --max-time 170 -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://sac.lojasmaia.com.br/api/totvs-sync"
      - name: Chamar /api/sync
        continue-on-error: true
        run: |
          curl -sf --max-time 170 -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://sac.lojasmaia.com.br/api/sync"
      - name: Chamar /api/sync-ai-classify
        continue-on-error: true
        run: |
          curl -sf --max-time 170 -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://sac.lojasmaia.com.br/api/sync-ai-classify"
      - name: Chamar /api/backup
        continue-on-error: true
        run: |
          curl -sf --max-time 170 -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://sac.lojasmaia.com.br/api/backup"
